name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  anylint:
    name: anylint (lib + examples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NyxilumEngine
        uses: actions/checkout@v4
        with:
          path: NyxilumEngine

      # anylint потребує реального 'nx' CLI на PATH для аналізу .nx
      # (викликає 'nx ast' - той самий механізм, що NyxilumProviderTest
      # у самому репозиторії anylint) - тому спочатку збираємо
      # NyxilumLang.
      - name: Checkout NyxilumLang
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumLang
          path: NyxilumLang

      # NyxilumLang.csproj має ProjectReference на сестринський
      # репозиторій NyxilumDb (../../../NyxilumDb/... відносно
      # NyxilumLang/src/NyxilumLang/) - без нього "dotnet build"
      # падає з "project was not found" (реальна помилка, спіймана ПІД
      # ЧАС першого запуску цього CI) - той самий сусідній-репозиторій
      # лейаут, що на робочій машині Sviatoslav'а.
      - name: Checkout NyxilumDb
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - name: Checkout anylint
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/anylint
          path: anylint

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # NyxilumLang.csproj цілить ДВА TargetFrameworks
      # (net10.0-windows;net10.0) - "-f net10.0" ОДНОГО не досить на
      # Linux-раннері: restore/evaluate все одно падає на
      # net10.0-windows (NETSDK1100), ПОКИ не додати
      # "-p:EnableWindowsTargeting=true" (не вмикає Windows Forms
      # насправді - лише дозволяє SDK ОЦІНИТИ багатоцільовий проєкт
      # без падіння) - ТА САМА команда, що вже виведена живцем цієї ж
      # сесії для NyxilumMcp's nyxilum_dev_build (src/dev.js), а тут
      # знову перевірена (перша версія без -p:EnableWindowsTargeting
      # реально провалила CI-запуск - не здогадка заздалегідь).
      - name: Build nx CLI
        run: |
          dotnet build NyxilumLang/src/NyxilumLang -f net10.0 -c Release -p:EnableWindowsTargeting=true
          echo "$(pwd)/NyxilumLang/src/NyxilumLang/bin/Release/net10.0" >> "$GITHUB_PATH"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install anylint dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: anylint

      - name: Перевірити, що 'nx' реально на PATH
        run: nx --version

      - name: anylint (увесь репозиторій - lib/examples/tests)
        # bin/anylint приймає ЛИШЕ ОДИН шлях (не декілька аргументів) -
        # перевірено читанням bin/anylint у самому репозиторії anylint -
        # тому весь NyxilumEngine одразу, не lib/ і examples/ окремо.
        working-directory: anylint
        run: php bin/anylint ../NyxilumEngine
